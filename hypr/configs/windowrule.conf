# Variables
$inFocusOpacity = 0.97
$notInFocusOpacity = 0.90

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# No grimblast screenshot slide effect
layerrule {
    name = selection-fade
    match:namespace = selection
    animation = fade
}

layerrule {
    name = hyprpicker-fade
    match:namespace = hyprpicker
    animation = fade
}

# Enable wlogout blur
layerrule {
    name = wlogout-blur
    match:namespace = logout_dialog
    blur = true
}

# No wlogout slide effect
layerrule {
    name = wlogout-fade
    match:namespace = logout_dialog
    animation = fade
}
